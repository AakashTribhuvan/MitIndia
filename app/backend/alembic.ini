# Alembic configuration for the SignLine Emergency database.
#   cd app/backend && .venv/Scripts/alembic upgrade head
# The URL comes from SIGNLINE_EM_DATABASE_URL (see signline_emergency/config.py).
[alembic]
script_location = signline_emergency/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
